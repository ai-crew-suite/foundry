name: Check Upstream ESLint Alignment

on:
  pull_request:
    paths:
      - "package.json"
      - "yarn.lock"
      - "packages/config-eslint/src/index.ts"

permissions:
  pull-requests: write
  contents: read
  copilot-requests: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - name: 🕵️ Run Centralized ESLint Drift Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        uses: ai-crew-suite/actions/eslint-alignment-check@v1
