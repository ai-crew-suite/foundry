# Location: [Your-Other-Plugin-Repos] -> .github/workflows/playwright.yml
name: Playwright

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    environment: testing
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'hotfix/') }}
    permissions:
      actions: write
      contents: read
    steps:
      - name: 📂 Checkout Application Source
        uses: actions/checkout@v4
      - name: 🏎️ Run Centralized Playwright Suite
        uses: ai-crew-suite/actions/playwright-run@v1
        with:
          dev-server-port: "3000"

  hotfix-bypass:
    name: E2E Test Hotfix Bypass
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.head_ref || github.ref_name, 'hotfix/') }}
    steps:
      - name: 🪵 Execute Centralized Bypass Registration
        uses: ai-crew-suite/actions/playwright-bypass@v1
